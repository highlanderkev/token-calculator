[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "token-calculator"
version = "0.1.0"
description = "Simple LLM/Agentic Token Calculator — usable as a plugin in agentic AI systems"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["llm", "tokens", "ai", "langchain", "openai", "plugin"]
dependencies = [
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
transformers = [
    "transformers>=4.40.0",
]
langchain = [
    "langchain-core>=0.2.0",
]
all = [
    "transformers>=4.40.0",
    "langchain-core>=0.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.entry-points."token_calculator.plugins"]
default = "token_calculator.plugin:TokenCalculatorTool"

[tool.hatch.build.targets.wheel]
packages = ["token_calculator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
